# ============================================
# BHOOMI DARPAN - LAND REGISTRATION SYSTEM
# ============================================

# ==============================
# SERVER CONFIGURATION
# ==============================
server.port=8080
server.servlet.context-path=/api
server.servlet.multipart.max-file-size=200MB
server.servlet.multipart.max-request-size=215MB

# ==============================
# APPLICATION CONFIG
# ==============================
spring.application.name=BhoomiDarpan
app.version=1.0.0
app.environment=development
app.debug=true
app.demo-mode=false

# ==============================
# DATABASE CONFIGURATION
# ==============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE CONFIGURATION
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# ==============================
# FILE UPLOAD CONFIGURATION
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=215MB

app.file.upload-dir=./uploads
app.file.max-size=10485760
app.file.allowed-extensions=.pdf,.jpg,.jpeg,.png,.tiff,.bmp

# ==============================
# JWT SECURITY CONFIGURATION
# ==============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.header=Authorization
app.jwt.prefix=Bearer

# ============================================
# BLOCKCHAIN CONFIGURATION
# ============================================

blockchain.enabled=true

# Infura RPC URL
blockchain.rpc.url=${BLOCKCHAIN_RPC_URL}

# Sepolia Chain ID
blockchain.chain.id=11155111

# Smart Contract Address
blockchain.contract.address=${BLOCKCHAIN_CONTRACT_ADDRESS}

# Private Key
blockchain.private.key=${BLOCKCHAIN_PRIVATE_KEY}

# Gas Settings
blockchain.gas.limit=6721975
blockchain.gas.price=20000000000

# ==============================
# OCR CONFIGURATION
# ==============================
app.ocr.enabled=true
app.ocr.tesseract-path=C:/Program Files/Tesseract-OCR/tesseract.exe
app.ocr.tessdata-path=C:/Program Files/Tesseract-OCR/tessdata
app.ocr.languages=eng+hin+mar
app.ocr.dpi=300
app.ocr.page-seg-mode=3
app.ocr.engine-mode=3

# ==============================
# BIOMETRIC / QR / NOTIFICATION
# ==============================
app.biometric.enabled=true
app.qr-code.enabled=true
app.notifications.enabled=true

# ==============================
# EMAIL CONFIGURATION
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================
# CORS CONFIGURATION
# ==============================
app.security.cors.allowed-origins=${FRONTEND_URL}
app.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.security.cors.allowed-headers=*
app.security.cors.allow-credentials=true

# ==============================
# VALIDATION RULES
# ==============================
app.validation.aadhaar-length=12
app.validation.pan-length=10
app.validation.mobile-length=10
app.validation.min-password-length=8
app.validation.max-file-size=10

# ==============================
# LOGGING CONFIGURATION
# ==============================
logging.level.com.bhoomidarpan=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.web3j=INFO
logging.level.net.sourceforge.tess4j=INFO

logging.file.name=./logs/bhoomidarpan.log

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================
# ASYNC & SCHEDULING
# ==============================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=bhoomi-async-

spring.task.scheduling.pool.size=5

# ==============================
# SWAGGER / OPENAPI
# ==============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# ==============================
# JACKSON / TIMEZONE
# ==============================
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

app.base-url=${BASE_URL}

# ==============================
# TRANSACTION MANAGEMENT
# ==============================
spring.transaction.default-timeout=120

# ==============================
# AI SERVICE
# ==============================
ai.service.url=${AI_SERVICE_URL}

# ==============================
# FILE STORAGE
# ==============================
file.upload-dir=./uploads/property-documents

# ==============================
# HUGGING FACE API
# ==============================
huggingface.api.key=${HUGGINGFACE_API_KEY}